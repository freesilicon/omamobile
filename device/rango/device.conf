# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 10 Pro Fold (rango), Stage 1 draft.
# Data only: no shell. Verified against stock Android 17 CP3A.261005.005.
#
# CRITICAL Pre-flash gate (CONTRIBUTING §3.1): captured Slot A reported
# bootable=0 and an older bootloader (deepspace-17.4-16025385) than Slot B
# (deepspace-17.4-16119390). Sync Slot A to 16119390 via full OTA before
# flashing Stage 1 images onto Slot B.

# --- Identity ---
CODENAME=rango
NAME="Pixel 10 Pro Fold"
USB_PRODUCT="Pixel 10 Pro Fold (M1)"
SOC=laguna
COMPATIBLE="google,lga-rango"
PACKAGE=omamobile-device-rango

# --- Kernel and device tree ---
DTB=exynos/google/lga-rango.dtb
# ABL matches base DTB on /soc_compatible/B0 (product_id=0x5, major=1, minor=0, pkg_mode=0).
SOC_COMPATIBLE="b0:0x5:1:0:0"

# --- Bootloader glue ---
DTBO_SOURCE=rango-m1-overlay.dts
DTBO_BOARD_ID=0x70606
DTBO_BOARD_REV=0x10000
# AP debug console is serial0 (/uart@db61000, lsion_cli16_uart, reg 0xdb62000, GIC_SPI 688).
# serial2 at 0x3a322000 is the Modem UART behind lsioe GIA.
VENDOR_CMDLINE="console=tty0 earlycon=uart8250,mmio32,0xdb62000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
BOOT_METHOD=android-v4
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
# Storage guard keeps UFS_RW_LUNS unset so sdb/sdc/sdd and LUN4 sde (zoned_device) stay RO.
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05

# --- Radio & calibration backup ---
NV_PARTS="efs efs_backup modem_userdata persist modem_a modem_b pinfo trusty_persist trusty_userdata mfg_data"
NV_BACKUP_EXTRA="devinfo blenv rdbl"

# --- Guided install ---
INSTALL_KEYS_FASTBOOT="with the phone off, hold Volume Down, then also hold Power, until Fastboot Mode appears (up to about 20 seconds)"
INSTALL_KEYS_RESTART="hold Power for about 30 seconds, then press it again"
INSTALL_FREE_GB=35

# --- Initramfs ---
INITRAMFS_INIT=/initramfs/init
# SIMPLEFB_TRIG_CON intentionally unset: stock ABL leaves no simple-framebuffer
# carveout and VeriSilicon DC9x00 display handoff is not probed yet.
# Cover panel is 1080x2364 portrait (inner panel is 2076x2152 @ 120 Hz).
PANEL_SIZE=1080x2364
