# SPDX-License-Identifier: MIT
# Laguna S5400i cellular modem stays disabled by default until the clean-room
# Laguna cpif kernel driver lands and the owner explicitly opts in.
# Never run cheetah's generic gs201 modem starter and never write NV/EFS.
[Unit]
ConditionPathExists=/etc/omamobile/laguna-modem-enable
ConditionPathExists=/dev/umts_ipc0
