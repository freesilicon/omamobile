# SPDX-License-Identifier: MIT
# Opt-in Laguna S5400i SIT RIL policy for omamobile-modem-sit: disabled by
# default until the clean-room Laguna cpif kernel driver exposes /dev/umts_ipc0
# and the owner explicitly creates /etc/omamobile/laguna-modem-enable.
# Requisite checks without pulling a modem start job; zero NV/EFS writes.
[Unit]
Requisite=omamobile-modem.service
After=omamobile-modem.service
ConditionPathExists=/etc/omamobile/laguna-modem-enable
ConditionPathExists=/dev/umts_ipc0
